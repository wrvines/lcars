# =============================================================================
# LCARS — Star Trek TNG console look for Ghostty
# =============================================================================
# Installed as part of the lcars terminal theme. Included from your main
# Ghostty config with a single `config-file` line placed inside a marked
# block, so uninstalling only removes that block.
#
# __LCARS_DIR__ is replaced with the real install path by the installer.
# Paths can be adjusted by hand if you installed somewhere custom.
# =============================================================================

# --- palette -----------------------------------------------------------------
background = #000000
foreground = #FFCC99
cursor-color = #FF9900
cursor-text = #000000
cursor-style = block
cursor-style-blink = false
selection-background = #CC99CC
selection-foreground = #000000
# Bold text in terminal output (titles, emphasis, highlights) gets the LCARS
# highlight color; regular text stays peach.
bold-color = #FF9900
minimum-contrast = 3

palette = 0=#000000
palette = 1=#CC4455
palette = 2=#99CC66
palette = 3=#FFCC66
palette = 4=#6699CC
palette = 5=#CC99CC
palette = 6=#66CCCC
palette = 7=#FFCC99
palette = 8=#555577
palette = 9=#FF6677
palette = 10=#B3E085
palette = 11=#FFDD88
palette = 12=#99CCFF
palette = 13=#DDB3DD
palette = 14=#99E0E0
palette = 15=#FFEECC

# --- frame -------------------------------------------------------------------
# The LCARS frame is drawn by lcars-frame.glsl: a size-aware border that
# always hugs the window edge, at any size, aspect or DPI, and stays visible
# over full-screen apps (tmux, editors, ...). It is enabled in the shader
# section below.
#
# The generated PNG art cannot do that: Ghostty stretches images to the
# window and draws them behind application backgrounds, so they align only at
# their design size and disappear behind opaque apps. To use the art anyway,
# comment the lcars-frame.glsl custom-shader line below and uncomment:
# background-image = __LCARS_DIR__/assets/lcars-frame-16x9.png
# background-image = __LCARS_DIR__/assets/lcars-frame-21x9.png
# background-image = __LCARS_DIR__/assets/lcars-frame-4x3.png
# background-image-opacity = 1.0
# background-image-fit = stretch
# background-image-position = center
# background-image-repeat = false

# Padding keeps text clear of the frame band. The band grows with the window
# height (capped by BAND_MAX in lcars-frame.glsl), so these values hold at any
# size and DPI.
window-padding-x = 48
window-padding-y = 40
window-padding-balance = true

# --- LCARS bell --------------------------------------------------------------
# The custom audio bell needs Ghostty 1.2+ (Linux) / 1.3+ (macOS).
# Falls back to the system sound if the audio feature is unavailable.
bell-features = audio,no-system,no-attention,no-title,no-border
bell-audio-path = __LCARS_DIR__/sounds/lcars-confirm.wav
bell-audio-volume = 0.35

# --- shaders (optional) -------------------------------------------------------
# lcars-frame draws the LCARS border; lcars-crt adds subtle scanlines and a
# vignette on top of everything. Comment a line to disable that pass.
custom-shader = __LCARS_DIR__/ghostty/shaders/lcars-frame.glsl
custom-shader = __LCARS_DIR__/ghostty/shaders/lcars-crt.glsl
custom-shader-animation = false

# --- window chrome -----------------------------------------------------------
window-theme = dark
unfocused-split-opacity = 0.72
unfocused-split-fill = #000000
split-divider-color = #996699
search-background = #FFCC66
search-foreground = #000000
search-selected-background = #FF9900
search-selected-foreground = #000000

# --- macOS titlebar ----------------------------------------------------------
macos-titlebar-style = transparent
macos-titlebar-proxy-icon = hidden

# --- optional extras ---------------------------------------------------------
# LCARS consoles are roomy. Uncomment for slightly taller cells (TUI-safe).
# adjust-cell-height = 10%
#
# If you install the Antonio or LCARS GTJ3 display fonts, they are not
# monospace and will not align in a terminal grid — use them in art instead.
# font-family = JetBrains Mono
# font-size = 13
