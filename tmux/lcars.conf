# =============================================================================
# LCARS tmux status bar
# =============================================================================
# Loaded via a marked `source-file` line in your tmux config by the installer.
# =============================================================================

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=#000000,bg=#FF9900"

set -g status-left-length 40
set -g status-left "#[fg=#000000,bg=#CC99CC,bold] LCARS #[fg=#000000,bg=#FF9900] #S "

set -g status-right-length 90
set -g status-right "#[fg=#000000,bg=#99CCFF] %H:%M #[fg=#000000,bg=#996699] %d %b "

set -g window-status-format "#[fg=#FFCC99,bg=#FF9900] #I:#W "
set -g window-status-current-format "#[fg=#000000,bg=#FFCC66,bold] #I:#W "
set -g window-status-separator ""

set -g pane-border-style "fg=#554455"
set -g pane-active-border-style "fg=#FF9900"

set -g message-style "fg=#000000,bg=#FFCC66"
set -g message-command-style "fg=#000000,bg=#FFCC66"
set -g mode-style "fg=#000000,bg=#99CCFF"

set -g clock-mode-colour "#FF9900"
set -g display-panes-colour "#CC99CC"
set -g display-panes-active-colour "#FF9900"
